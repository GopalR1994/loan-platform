spring:
  application:
    name: loan-platform-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:sandbox}

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html
