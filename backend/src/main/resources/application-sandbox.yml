spring:

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/loan_sandbox}
    username: ${DB_USERNAME:loan_user}
    password: ${DB_PASSWORD:loan_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

logging:
  level:
    root: INFO
    com.loanplatform: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

  otp:
    length: ${OTP_LENGTH:6}
    expiration-seconds: ${OTP_EXPIRATION_SECONDS:300}
